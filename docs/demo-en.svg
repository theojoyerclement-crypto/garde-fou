<defs><clipPath id="c"><rect class="type" x="22" y="32" width="184.8" height="21"/></clipPath></defs>
<text x="22" y="48" clip-path="url(#c)"><tspan fill="#79c0ff">$ npx gardefou my-app</tspan></text>
